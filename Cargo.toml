[package]
name = "MadEdit"
version = "0.5.22"
edition = "2024"
rust-version = "1.92"

[dependencies]
arboard = "3"
chrono = "0.4"
dirs = "6"
eframe = "0.35.0"
encoding_rs = "0.8.42"
fontique = "0.11.1"
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1.11"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spellbook = "0.4.2"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject", "NSString", "NSURL", "objc2-core-services"] }

[build-dependencies]
embed-resource = "3.0.6"

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["eframe", "wgpu"] }

# 保留 AccessKit 無障礙支援，回補尚未發行的 macOS KVO 修正（見 vendor/README.md）。
[patch.crates-io]
accesskit_macos = { path = "vendor/accesskit_macos" }
