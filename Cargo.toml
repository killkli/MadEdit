[package]
name = "MadEdit"
version = "0.5.23"
edition = "2024"

[dependencies]
arboard = "3"
chrono = "0.4"
dirs = "7"
eframe = "0.37.0"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "svg", "load-images"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# Mermaid 圖表點陣化用；版本須與 egui_extras 內部的 resvg 一致
resvg = "0.45"
encoding_rs = "0.8.42"
fermaid = "0.5"
fontique = "0.11.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1.11"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spellbook = "0.4.2"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"

[build-dependencies]
embed-resource = "3.0.6"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
