<?xml version="1.0" encoding="UTF-8"?>
<!--
  MadEdit 應用程式圖示（圖示來源真檔，請勿直接編輯產生檔）
  產生方式：
    rsvg-convert -w 512 -h 512 assets/madedit-icon.svg -o assets/madedit-icon.png
    convert assets/madedit-icon.png -define icon:auto-resize=256,128,64,48,32,16 assets/madedit-icon.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="madedit-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- 圓角方形底板 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#madedit-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8"/>

  <!-- 白色 M 字樣（代表 MadEdit 的第一個字母） -->
  <path d="M 128 356 L 128 160 L 256 272 L 384 160 L 384 356"
        fill="none" stroke="#ffffff" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 琥珀色文字選取列（呼應文字編輯器的選取與游標） -->
  <rect x="128" y="392" width="256" height="28" rx="14" fill="#fbbf24"/>
</svg>
